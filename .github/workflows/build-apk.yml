name: Build Streamer APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Move files to repo root if inside workflows
        run: |
          if [ -d ".github/workflows/app" ] || [ -f ".github/workflows/build.gradle.kts" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            for f in app build.gradle.kts gradle.properties settings.gradle.kts; do
              [ -e ".github/workflows/$f" ] && git mv ".github/workflows/$f" "$f"
            done
            git commit -m "Move project files to repo root" || true
            git push || true
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Streamer.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Streamer-APK
          path: Streamer.apk

      - name: Publish Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Streamer v1.0.${{ github.run_number }}
          files: Streamer.apk
          make_latest: true
