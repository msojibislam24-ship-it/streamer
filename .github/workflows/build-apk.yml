name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up the Android project
        run: |
          mkdir app && cd app
          mkdir www && cp ../index.html www/index.html
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.family.streamer",
            "appName": "Streamer",
            "webDir": "www",
            "android": { "allowMixedContent": true },
            "plugins": { "CapacitorHttp": { "enabled": true } }
          }
          EOF
          npx cap add android
          python3 - <<'EOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          s = s.replace('<category android:name="android.intent.category.LAUNCHER" />',
                        '<category android:name="android.intent.category.LAUNCHER" />\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />')
          s = s.replace('<application',
                        '<uses-feature android:name="android.software.leanback" android:required="false" />\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n    <application', 1)
          s = s.replace('android:allowBackup="true"',
                        'android:allowBackup="true"\n        android:banner="@mipmap/ic_launcher"\n        android:usesCleartextTraffic="true"', 1)
          assert 'LEANBACK_LAUNCHER' in s and 'leanback' in s and 'usesCleartextTraffic' in s, 'manifest patch failed'
          open(p, 'w').write(s)
          EOF

      - name: Build the APK
        working-directory: app/android
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk Streamer.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Streamer.apk --title "Streamer" --notes "Newest build"
