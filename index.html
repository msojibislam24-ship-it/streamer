<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23ff3d7f'/><polygon points='38,28 76,50 38,72' fill='%230a0a0f'/></svg>">
<title>Streamer</title>
<style>
:root{
  --bg:#0a0a0f;--bg2:#13131c;--card:#1a1a26;--card2:#232334;
  --fg:#f4f2f8;--mut:#9490a8;--ac:#ff3d7f;--ac2:#7b5cff;--ok:#34d399;--warn:#fbbf24;
  --bd:rgba(255,255,255,.08);--nav:64px
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior-y:contain}
body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 18px)}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit;color:var(--fg)}
button{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .12s,background .15s}
button:active{transform:scale(.97)}
button.pri{background:var(--ac);color:#19040c;border-color:transparent;font-weight:700}
button.sec{background:rgba(255,255,255,.09);backdrop-filter:blur(10px)}
button.sm{padding:6px 11px;font-size:13px;border-radius:9px}
button.on{background:var(--ac);color:#19040c;border-color:transparent;font-weight:700}
button:disabled{opacity:.42;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,.card:focus-visible,.ep:focus-visible{outline:3px solid #fff;outline-offset:2px}
input,textarea{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;outline:none}
input:focus,textarea:focus{border-color:var(--ac)}
[hidden]{display:none!important}

/* Header & Bottom Mobile Nav */
header{position:sticky;top:0;z-index:10;background:rgba(10,10,15,.88);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:-.3px;cursor:pointer}
.brand .dot{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-size:13px;color:#fff}
.dnav{display:none;gap:6px;margin-left:8px}
.dnav button{background:transparent;border-color:transparent;color:var(--mut);padding:8px 12px}
.dnav button.act{color:var(--fg);background:var(--card)}
#sf{flex:1;display:flex;gap:8px;max-width:440px;margin-left:auto}
#sf input{padding:9px 13px;border-radius:99px;background:var(--bg2)}
#sf button{border-radius:99px;padding:9px 14px}

.bnav{position:fixed;bottom:0;left:0;right:0;z-index:15;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(14,14,22,.95);backdrop-filter:blur(18px);border-top:1px solid var(--bd);display:flex;justify-content:space-around;align-items:center}
.bnav button{flex:1;height:100%;background:transparent;border:none;border-radius:0;flex-direction:column;gap:3px;font-size:11px;color:var(--mut);padding:6px 4px}
.bnav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bnav button.act{color:var(--ac)}
@media(min-width:760px){body{padding-bottom:28px}.bnav{display:none}.dnav{display:flex}}

/* Cards & Sections */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:20px 14px 8px}
.sec-h h2{margin:0;font-size:17px;font-weight:700}
.sec-h span{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.mut{color:var(--mut);font-size:14px;margin:10px 14px}
.row{display:flex;gap:11px;overflow-x:auto;padding:4px 14px 12px;scrollbar-width:none;scroll-snap-type:x proximity}
.row::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;padding:6px 14px}
@media(min-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(144px,1fr));gap:14px}}

.card{flex:0 0 116px;width:116px;scroll-snap-align:start;cursor:pointer;border-radius:12px;position:relative}
.grid .card{width:100%;flex:none}
@media(min-width:600px){.card{flex:0 0 144px;width:144px}}
.card .pw{position:relative;aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:var(--card);border:1px solid var(--bd)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .noimg{position:absolute;inset:0;display:grid;place-items:center;padding:10px;text-align:center;font-size:12px;color:var(--mut);background:linear-gradient(160deg,var(--card),var(--bg2))}
.card .badge{position:absolute;top:6px;right:6px;background:rgba(10,10,15,.8);padding:2px 6px;border-radius:6px;font-size:11px;font-weight:700;color:var(--warn)}
.card .prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.18)}
.card .prog i{display:block;height:100%;background:var(--ac)}
.card .t{font-size:13px;font-weight:600;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .sub{font-size:11px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Featured Banner */
.feat{position:relative;margin:12px 14px 6px;border-radius:18px;overflow:hidden;min-height:230px;background:var(--card);border:1px solid var(--bd);display:flex;align-items:flex-end;cursor:pointer}
@media(min-width:700px){.feat{min-height:330px}}
.feat .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.7}
.feat::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,15,.1) 0%,rgba(10,10,15,.65) 55%,rgba(10,10,15,.98) 100%)}
.feat .in{position:relative;z-index:2;padding:18px;max-width:620px}
.feat .tag{display:inline-block;background:rgba(255,61,127,.22);border:1px solid rgba(255,61,127,.45);color:#ff8fb5;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;margin-bottom:6px;text-transform:uppercase}
.feat h1{margin:0 0 6px;font-size:23px;line-height:1.15}
.feat p{margin:0 0 12px;font-size:13px;color:#d0cde0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Detail Page */
.hero{position:relative;overflow:hidden;padding:18px 14px 20px;border-bottom:1px solid var(--bd)}
.hero .backdrop{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(14px) brightness(.38);transform:scale(1.08)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,15,.25),var(--bg))}
.hero .wrap{position:relative;z-index:2;display:flex;gap:16px;align-items:flex-start;max-width:960px;margin:0 auto}
.hero .poster{width:110px;flex-shrink:0;aspect-ratio:2/3;object-fit:cover;border-radius:12px;background:var(--card);border:1px solid var(--bd);box-shadow:0 12px 30px rgba(0,0,0,.6)}
@media(min-width:640px){.hero .poster{width:168px}}
.hero .info{flex:1;min-width:0}
.hero h1{margin:0 0 6px;font-size:22px;line-height:1.2}
@media(min-width:640px){.hero h1{font-size:30px}}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.09);color:#dcd9ea}
.pill.rt{color:var(--warn);font-weight:700}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.desc{font-size:14px;color:#cbc7dc;margin:8px 0 0;max-width:68ch}

.wrap-col{max-width:960px;margin:0 auto;padding:0 14px}
.ep-list{display:grid;gap:9px;margin-top:10px}
.ep{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:9px;cursor:pointer;text-align:left;width:100%}
.ep .th{width:108px;aspect-ratio:16/9;border-radius:8px;background:var(--bg2);overflow:hidden;flex-shrink:0;display:grid;place-items:center;color:var(--mut);font-size:12px;font-weight:700}
.ep .th img{width:100%;height:100%;object-fit:cover}
.ep .em{flex:1;min-width:0}
.ep .et{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.ep .ed{font-size:12px;color:var(--mut);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep .ck{color:var(--ok);font-weight:800}

.streams-box{display:grid;gap:9px;margin-top:10px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:12px;display:flex;flex-direction:column;gap:8px}
.st-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.st-src{font-size:12px;font-weight:700;color:var(--ac);text-transform:uppercase;letter-spacing:.4px}
.st-tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.08);font-weight:600}
.tag.hd{background:rgba(123,92,255,.22);color:#c3b5ff}
.tag.ok{background:rgba(52,211,153,.18);color:var(--ok)}
.tag.wn{background:rgba(251,191,36,.18);color:var(--warn)}
.st-title{font-size:13px;color:#dedae8;white-space:pre-line;word-break:break-word}
.st-acts{display:flex;gap:8px;flex-wrap:wrap}

.panel{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 14px}
.ad{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:12px 14px;margin:8px 14px}
.ad .info{min-width:0;flex:1}
.ad .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ad .rs{font-size:12px;color:var(--mut);margin-top:2px}
.ad .btns{display:flex;gap:6px;flex-shrink:0}
.add-row{display:flex;gap:8px;padding:0 14px}
.chips{display:flex;gap:8px;padding:6px 14px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.search-box{padding:12px 14px 4px;display:flex;gap:8px}
.skel{background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* PRO Mobile Video Player */
#pl{position:fixed;inset:0;z-index:50;background:#000;display:flex;align-items:center;justify-content:center;user-select:none;overflow:hidden}
#pl video{width:100%;height:100%;object-fit:contain;background:#000}
#bright-veil{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:2}
#gesture-pad{position:absolute;inset:0;z-index:3;touch-action:none}
#pl .ui{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(180deg,rgba(0,0,0,.82) 0%,transparent 28%,transparent 65%,rgba(0,0,0,.9) 100%);transition:opacity .22s;padding:12px 14px;pointer-events:none}
#pl .ui .top,#pl .ui .mid,#pl .ui .bot{pointer-events:auto}
#pl.hide .ui{opacity:0}
#pl.hide .ui .top,#pl.hide .ui .mid,#pl.hide .ui .bot{pointer-events:none}
#pl.locked .top,#pl.locked .mid,#pl.locked .bot{display:none}
#unlock-btn{position:absolute;top:14px;left:14px;z-index:6;background:rgba(15,15,24,.8);border:1px solid rgba(255,255,255,.25)}

#pl .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
#pl .ttl{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-shadow:0 1px 4px #000}
#pl .top-b{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#pl .mid{display:flex;align-items:center;justify-content:center;gap:22px}
#pl .mid button{width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.58);border:1px solid rgba(255,255,255,.22);font-size:14px;font-weight:700}
#pl .mid .playb{width:68px;height:68px;background:var(--ac);color:#19040c;border:none;font-size:22px}
#pl .bot{display:flex;flex-direction:column;gap:8px}
#pl .seek-row{display:flex;align-items:center;gap:10px;font-size:12px;font-variant-numeric:tabular-nums}
#pl input[type=range]{flex:1;padding:0;height:6px;accent-color:var(--ac);background:rgba(255,255,255,.28);border:none;border-radius:99px}
#pl .bot-acts{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
#pl .bot-g{display:flex;gap:6px;flex-wrap:wrap}
#pl .x{background:rgba(18,18,28,.8);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px)}

#sub-box{position:absolute;left:6%;right:6%;bottom:92px;z-index:5;text-align:center;pointer-events:none;transition:bottom .2s}
#pl.hide #sub-box{bottom:26px}
#sub-box span{display:inline-block;padding:4px 12px;border-radius:8px;line-height:1.35;white-space:pre-line}
#sub-box span.box{background:rgba(0,0,0,.78);color:#fff;text-shadow:0 1px 3px #000}
#sub-box span.out{background:transparent;color:#fff;text-shadow:0 0 4px #000,0 2px 4px #000,1px 0 2px #000,-1px 0 2px #000}

#hud{position:absolute;top:22%;left:50%;transform:translateX(-50%);z-index:7;background:rgba(10,10,16,.84);border:1px solid rgba(255,255,255,.15);padding:9px 18px;border-radius:99px;font-weight:700;font-size:15px;pointer-events:none}
#pl .pop{position:absolute;right:12px;bottom:86px;left:12px;margin-left:auto;z-index:8;width:min(360px,94vw);max-height:62vh;overflow:auto;background:rgba(16,16,24,.97);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:14px;backdrop-filter:blur(18px)}
#pl .pop h3{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
#pl .pop .opt{width:100%;justify-content:space-between;margin-bottom:6px;text-align:left}
#pl .err{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:rgba(0,0,0,.88)}
#pl .nx{position:absolute;bottom:100px;right:16px;z-index:7}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:rgba(15,15,24,.94);border:1px solid var(--bd);padding:9px 18px;border-radius:99px;z-index:70;font-size:14px}
</style>
</head>
<body>
<header>
  <div class="brand" onclick="go('#/')"><span class="dot">▶</span><span>Streamer</span></div>
  <nav class="dnav">
    <button data-nav="home" onclick="go('#/')">Home</button>
    <button data-nav="search" onclick="go('#/s/')">Search</button>
    <button data-nav="addons" onclick="go('#/addons')">Addons</button>
    <button data-nav="party" onclick="go('#/party')">Party</button>
  </nav>
  <form id="sf"><input id="q" type="search" placeholder="Search title or tt IMDb ID" enterkeyhint="search"><button class="pri sm">Go</button></form>
</header>

<main id="app"></main>

<nav class="bnav">
  <button data-nav="home" onclick="go('#/')">
    <svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
    <span>Home</span>
  </button>
  <button data-nav="search" onclick="go('#/s/')">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
    <span>Search</span>
  </button>
  <button data-nav="addons" onclick="go('#/addons')">
    <svg viewBox="0 0 24 24"><path d="M12 2l3 6 6 .9-4.5 4.4 1.1 6.2L12 16.5 6.4 19.5l1.1-6.2L3 8.9 9 8z"/></svg>
    <span>Addons</span>
  </button>
  <button data-nav="party" onclick="go('#/party')">
    <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    <span>Party</span>
  </button>
</nav>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const h=(t,a={},...k)=>{
  const e=document.createElement(t);
  for(const[n,v]of Object.entries(a)){
    if(v==null||v===false)continue;
    if(n.startsWith('on'))e.addEventListener(n.slice(2),v);
    else if(v===true)e.setAttribute(n,'');
    else e.setAttribute(n,v);
  }
  e.append(...k.flat().filter(c=>c!=null&&c!==false));
  return e;
};
const app=$('#app');
let rt=0,pl=null,party=null,ign=0;
const metaCache=new Map();

const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
let addons=(()=>{const a=ls('addons',null);return a&&a.length?a:[{base:'https://v3-cinemeta.strem.io',m:null}]})();
const saveAddons=()=>sv('addons',addons);
let fav=ls('fav',[]),hist=ls('hist',[]),pos=ls('pos',{}),done=ls('done',{}),recentQ=ls('recentQ',[]);

const toBase=u=>u.trim().replace(/^stremio:\/\//i,'https://').replace(/\/manifest\.json.*$/i,'').replace(/\/$/,'');
const get=async(b,p,ms=9000)=>{
  const c=new AbortController(),tm=setTimeout(()=>c.abort(),ms);
  try{
    const r=await fetch(b+p,{signal:c.signal});
    if(!r.ok)throw new Error('HTTP '+r.status);
    return await r.json();
  }finally{clearTimeout(tm)}
};
const refresh=a=>get(a.base,'/manifest.json').then(m=>{a.m=m;saveAddons()});
const go=hash=>{location.hash=hash};
const msg=t=>h('p',{class:'mut'},t);
const fmt=s=>{if(!s||isNaN(s))return'0:00';s=Math.floor(s);const m=Math.floor(s/60),r=String(s%60).padStart(2,'0');return m>=60?`${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}:${r}`:`${m}:${r}`};
const toast=t=>{const d=h('div',{class:'toast'},t);document.body.append(d);setTimeout(()=>d.remove(),2600)};
const setActiveNav=name=>$$('[data-nav]').forEach(b=>b.classList.toggle('act',b.dataset.nav==name));

const can=(a,name,type,id)=>(a.m?.resources||[]).some(r=>{
  const n=typeof r=='string'?r:r.name;if(n!=name)return false;
  const types=r.types||a.m.types||[],pre=r.idPrefixes||a.m.idPrefixes;
  return(!type||types.includes(type))&&(!pre||!id||pre.some(p=>id.startsWith(p)));
});

const card=(m,prog)=>{
  if(m?.id)metaCache.set(`${m.type}:${m.id}`,m);
  const img=m.poster?h('img',{src:m.poster,alt:'',loading:'lazy',onerror:e=>e.target.remove()}):null;
  return h('div',{class:'card',tabindex:0,
    onclick:()=>go(`#/m/${encodeURIComponent(m.type)}/${encodeURIComponent(m.id)}`),
    onkeydown:e=>{if(e.key=='Enter')e.currentTarget.click()}},
    h('div',{class:'pw'},
      h('div',{class:'noimg'},m.name||m.id),
      img,
      m.imdbRating&&h('span',{class:'badge'},'★ '+m.imdbRating),
      prog>0&&h('div',{class:'prog'},h('i',{style:`width:${Math.min(100,prog*100)}%`}))
    ),
    h('div',{class:'t'},m.name||m.id),
    (m.lab||m.releaseInfo||m._src)&&h('div',{class:'sub'},m.lab||m.releaseInfo||m._src)
  );
};
const skelRow=()=>h('div',{class:'row'},...Array.from({length:6},()=>h('div',{class:'card'},h('div',{class:'pw skel'}))));

async function home(){
  setActiveNav('home');
  const tk=rt;
  const cats=addons.flatMap(a=>(a.m?.catalogs||[])
    .filter(c=>!(c.extra||[]).some(x=>x.isRequired)&&!(c.extraRequired||[]).length)
    .map(c=>({a,c}))).slice(0,10);
  if(!cats.length)return app.replaceChildren(
    h('div',{class:'panel'},h('b',{},'No catalogs installed'),msg('Open Addons to install a Stremio addon.'))
  );

  const featSlot=h('div');
  app.replaceChildren(featSlot);
  if(hist.length)app.append(
    h('div',{class:'sec-h'},h('h2',{},'Continue Watching'),h('span',{},hist.length+' items')),
    h('div',{class:'row'},...hist.slice(0,16).map(x=>card(x,x.d?x.t/x.d:0)))
  );
  if(fav.length)app.append(
    h('div',{class:'sec-h'},h('h2',{},'My List'),h('span',{},fav.length+' saved')),
    h('div',{class:'row'},...fav.map(m=>card(m)))
  );

  let featuredPicked=false;
  for(const{a,c}of cats){
    const row=skelRow();
    app.append(h('div',{class:'sec-h'},h('h2',{},c.name||c.id),h('span',{},c.type)),row);

async function streams(type,vid){

  const rs=await Promise.allSettled(list.map(a=>
    get(a.base,`/stream/${type}/${encodeURIComponent(vid)}.json`,12000)
      .then(v=>(v.streams||[]).map(s=>({...s,_addon:a.m?.name||a.base})))
  ));
  return rs.flatMap(r=>r.status=='fulfilled'?r.value:[]);

const intentUrl=u=>{
  const m=u.match(/^(https?):\/\/(.*)$/i);
  return m?`intent://${m[2]}#Intent;action=android.intent.action.VIEW;scheme=${m[1].toLowerCase()};type=video/*;end`:u;
};
const streamTags=s=>{
  const txt=[s.name,s.title,s.description,s.url,s.behaviorHints?.filename].filter(Boolean).join(' ');
  const tags=[];
  const q=txt.match(/\b(2160p|4k|1080p|720p|480p)\b/i);if(q)tags.push([q[1].toUpperCase(),'hd']);
  if(/\.m3u8(\?|$)/i.test(s.url||''))tags.push(['HLS','ok']);
  else if(/\.mp4(\?|$)/i.test(s.url||''))tags.push(['MP4','ok']);
  else if(/\.mkv(\?|$)/i.test(txt)||s.behaviorHints?.notWebReady)tags.push(['MKV / Try VLC','wn']);
  if(/^http:\/\//i.test(s.url||'')&&location.protocol=='https:')tags.push(['HTTP (Use VLC)','wn']);
  return tags;
};

/* Watch Party */
const loadPeer=()=>window.Peer?Promise.resolve():new Promise((ok,no)=>document.head.append(h('script',{src:'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js',onload:ok,onerror:()=>no(new Error('Couldn’t load Watch Party library.'))})));
const redraw=()=>{if(location.hash=='#/party')route()};
function send(m,from){if(party)for(const c of party.conns)if(c!==from&&c.open)c.send(m)}
function applySync(m){
  const v=pl&&pl.querySelector('video');if(!v)return;
  ign=Date.now()+800;
  if(Math.abs(v.currentTime-m.time)>1.5)v.currentTime=m.time;
  if(m.state=='play')v.play().catch(()=>{});else v.pause();
}
function onMsg(m,from){
  if(!party||!m)return;
  if(party.host&&m.t!='ask')send(m,from);
  if(m.t=='play'){party.cur=m;play(m.url,m.title,{rem:1,type:m.type,vid:m.vid,m:m.m},!!pl)}
  else if(m.t=='sync')applySync(m);
  else if(m.t=='emo')toast(m.e);
  else if(m.t=='ask'){const v=pl&&pl.querySelector('video');if(v)from.send({t:'sync',state:v.paused?'pause':'play',time:v.currentTime})}
}
function wire(c){
  party.conns.push(c);
  c.on('data',m=>onMsg(m,c));
  const hi=()=>{toast('Someone joined');if(party.cur)c.send(party.cur);redraw()};
  c.open?hi():c.on('open',hi);
  c.on('close',()=>{if(!party)return;party.conns=party.conns.filter(x=>x!==c);toast('Someone left');redraw()});
}
function hostRoom(say){
  loadPeer().then(()=>{
    const cd=Array.from({length:4},()=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.random()*31|0]).join('');
    const peer=new Peer('strmwp-'+cd);
    peer.on('open',()=>{party={peer,host:true,code:cd,conns:[]};redraw()});
    peer.on('connection',wire);
    peer.on('error',e=>e.type=='unavailable-id'?hostRoom(say):say('Couldn’t start room ('+e.type+').'));
  }).catch(e=>say(e.message));
}
function joinRoom(cd,say){
  cd=cd.trim().toUpperCase();if(cd.length!=4)return say('Enter the 4-letter code.');
  say('Joining…');
  loadPeer().then(()=>{
    const peer=new Peer();
    peer.on('open',()=>{
      const c=peer.connect('strmwp-'+cd,{reliable:true});
      c.on('open',()=>{party={peer,host:false,code:cd,conns:[c]};c.on('data',m=>onMsg(m,c));c.on('close',()=>{toast('Host left the room');leave()});redraw()});
    });
    peer.on('error',e=>say(e.type=='peer-unavailable'?'No room with that code.':'Couldn’t join ('+e.type+').'));
  }).catch(e=>say(e.message));
}
function leave(){if(party){party.peer.destroy();party=null}redraw()}

/* Subtitle Parser (SRT + VTT + Local File) */
const parseTime=s=>{
  const p=s.trim().replace(',','.').split(':').map(Number);
  if(p.some(isNaN))return 0;
  return p.length==3?p[0]*3600+p[1]*60+p[2]:p[0]*60+p[1];
};
const parseSubs=txt=>{
  const cues=[];
  for(const blk of txt.replace(/^\uFEFF/,'').split(/\r?\n\s*\r?\n/)){
    const lines=blk.trim().split(/\r?\n/);
    const idx=lines.findIndex(l=>l.includes('-->'));
    if(idx<0)continue;
    const [a,b]=lines[idx].split('-->');
    const text=lines.slice(idx+1).join('\n').replace(/<[^>]+>/g,'').replace(/\{\\[^}]+\}/g,'').trim();
    if(text)cues.push({s:parseTime(a),e:parseTime(b.split(' ')[0]),t:text});
  }
  return cues;
};

  const epB=h('button',{class:'x sm',hidden:!(ctx.episodes?.length>1)},'Episodes');
  const nextB=h('button',{class:'x sm',hidden:!ctx.next},'Next ⏭');
  const fitB=h('button',{class:'x sm'},'Fit');
  const lockB=h('button',{class:'x sm'},'🔒');
  const spdB=h('button',{class:'x sm'},'1x');
  const playB=h('button',{class:'playb'},'⏸');
  const curT=h('span',{},'0:00'),durT=h('span',{},'0:00');
  const rng=h('input',{type:'range',min:0,max:1000,value:0});

  const top=h('div',{class:'top'},
    h('div',{class:'ttl'},title||''),
    h('div',{class:'top-b'},
      ...(party?['❤️','😂','😮','👏'].map(e=>h('button',{class:'x sm',onclick:()=>{send({t:'emo',e});toast(e)}},e)):[]),
      lockB,
      h('button',{class:'x sm',onclick:()=>history.back()},'✕')
    )
  );
  const mid=h('div',{class:'mid'},
    h('button',{onclick:()=>{v.currentTime=Math.max(0,v.currentTime-10)}},'-10s'),
    playB,
    h('button',{onclick:()=>{v.currentTime+=10}},'+10s')
  );
  const bot=h('div',{class:'bot'},
    h('div',{class:'seek-row'},curT,rng,durT),
    h('div',{class:'bot-acts'},
      h('div',{class:'bot-g'},
        h('button',{class:'x sm',onclick:()=>{v.currentTime+=85}},'+85s'),
        nextB,epB,srcB
      ),
      h('div',{class:'bot-g'},
        qualB,audB,ccB,spdB,fitB,
        h('a',{href:intentUrl(url)},h('button',{class:'x sm',type:'button'},'VLC')),
        h('button',{class:'x sm',onclick:()=>{
          if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
          else pl.requestFullscreen?.().catch(()=>{});
        }},'⛶')
      )
    )
  );

  const ui=h('div',{class:'ui'},top,mid,bot);
  const me=pl=h('div',{id:'pl'},v,veil,pad,subBox,ui,unlockB,hud,pop,err);
  document.body.append(me);
  if(!swap)history.pushState({p:1},'');

  let hideTm,hudTm,dragging=false,locked=false,bright=1;
  const showHud=t=>{hud.textContent=t;hud.hidden=false;clearTimeout(hudTm);hudTm=setTimeout(()=>hud.hidden=true,750)};
  const wake=()=>{
    me.classList.remove('hide');clearTimeout(hideTm);
    if(locked){unlockB.hidden=false;hideTm=setTimeout(()=>unlockB.hidden=true,2200);return}
    if(!v.paused&&pop.hidden)hideTm=setTimeout(()=>me.classList.add('hide'),3500);
  };

  /* Screen Lock */
  lockB.onclick=()=>{locked=true;me.classList.add('locked');pop.hidden=true;wake()};
  unlockB.onclick=()=>{locked=false;me.classList.remove('locked');unlockB.hidden=true;wake()};

  /* Touch Gestures: Brightness (Left), Volume (Right), Scrub (Horizontal), Double-tap (±10s) */
  let sx=0,sy=0,gMode=null,sTime=0,sVol=1,sBr=1,targetT=0,lastTap=0,lastTapX=0,tapTm=null;
  pad.addEventListener('pointerdown',e=>{
    if(e.button>0)return;
    sx=e.clientX;sy=e.clientY;gMode=null;sTime=v.currentTime;sVol=v.volume;sBr=bright;
    pad.setPointerCapture(e.pointerId);
  });
  pad.addEventListener('pointermove',e=>{
    if(!pad.hasPointerCapture(e.pointerId)||locked)return;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(!gMode){
      if(Math.abs(dx)>20&&Math.abs(dx)>Math.abs(dy))gMode='seek';
      else if(Math.abs(dy)>20)gMode=sx<me.clientWidth/2?'bright':'vol';
    }
    if(gMode=='seek'&&v.duration){
      const delta=dx*0.3;targetT=Math.max(0,Math.min(v.duration,sTime+delta));
      showHud(`${fmt(targetT)} (${delta>=0?'+':''}${Math.round(delta)}s)`);
    }else if(gMode=='bright'){
      bright=Math.max(.2,Math.min(1,sBr-dy/220));veil.style.opacity=(1-bright).toFixed(2);
      showHud(`☀ ${Math.round(bright*100)}%`);
    }else if(gMode=='vol'){
      v.volume=Math.max(0,Math.min(1,sVol-dy/220));
      showHud(`🔊 ${Math.round(v.volume*100)}%`);
    }
  });
  pad.addEventListener('pointerup',e=>{
    if(gMode=='seek'){v.currentTime=targetT;gMode=null;return}
    if(gMode){gMode=null;return}
    if(locked){wake();return}
    if(!pop.hidden){pop.hidden=true;wake();return}
    const now=Date.now(),w=me.clientWidth,x=e.clientX;
    if(now-lastTap<280&&Math.abs(x-lastTapX)<120){
      clearTimeout(tapTm);lastTap=0;
      const d=x<w/2?-10:10;v.currentTime=Math.max(0,v.currentTime+d);
      showHud(d<0?'⏪ -10s':'+10s ⏩');wake();
    }else{
      lastTap=now;lastTapX=x;
      tapTm=setTimeout(()=>{
        if(me.classList.contains('hide'))wake();
        else if(e.pointerType=='mouse')v.paused?v.play():v.pause();
        else{clearTimeout(hideTm);me.classList.add('hide')}
      },240);
    }
  });

  /* Controls */
  playB.onclick=()=>{v.paused?v.play():v.pause();wake()};
  spdB.onclick=()=>{const sp=[1,1.25,1.5,2,0.75];const n=sp[(sp.indexOf(v.playbackRate)+1)%sp.length];v.playbackRate=n;spdB.textContent=n+'x';showHud('Speed '+n+'x')};
  const fits=[['contain','Fit'],['cover','Fill'],['fill','Stretch']];let fi=0;
  fitB.onclick=()=>{fi=(fi+1)%fits.length;v.style.objectFit=fits[fi][0];fitB.textContent=fits[fi][1];showHud(fits[fi][1])};
  rng.oninput=()=>{dragging=true;if(v.duration)curT.textContent=fmt(v.duration*(rng.value/1000))};
  rng.onchange=()=>{if(v.duration)v.currentTime=v.duration*(rng.value/1000);dragging=false;wake()};

  const openPop=(headTitle,bodyNodes)=>{
    pop.replaceChildren(
      h('h3',{},headTitle,h('button',{class:'sm',onclick:()=>{pop.hidden=true;wake()}},'Done')),
      ...bodyNodes
    );
    pop.hidden=false;clearTimeout(hideTm);
  };

  /* Quality & Audio (HLS.js + Native) */
  let hlsInst=null;
  const openQual=()=>{
    if(!hlsInst?.levels?.length)return;
    const lv=hlsInst.levels;
    openPop('Video Quality',[
      h('button',{class:'sm opt'+(hlsInst.currentLevel==-1?' on':''),onclick:()=>{hlsInst.currentLevel=-1;qualB.textContent='Auto';pop.hidden=true}},'Auto (Recommended)',hlsInst.currentLevel==-1?'✓':''),
      ...lv.map((l,i)=>h('button',{class:'sm opt'+(hlsInst.currentLevel==i?' on':''),onclick:()=>{
        hlsInst.currentLevel=i;qualB.textContent=(l.height?l.height+'p':'L'+i);pop.hidden=true;showHud('Quality: '+qualB.textContent);
      }},`${l.height?l.height+'p':'Level '+i} ${l.bitrate?Math.round(l.bitrate/1000)+' kbps':''}`,hlsInst.currentLevel==i?'✓':''))
    ]);
  };
  qualB.onclick=openQual;

  audB.onclick=()=>{
    if(hlsInst?.audioTracks?.length){
      const ts=hlsInst.audioTracks;
      openPop('Audio Tracks',ts.map((t,i)=>
        h('button',{class:'sm opt'+(hlsInst.audioTrack==i?' on':''),onclick:()=>{
          hlsInst.audioTrack=i;audB.textContent='Audio: '+(t.lang||t.name||i+1);pop.hidden=true;showHud(audB.textContent);
        }},`${t.name||t.lang||'Track '+(i+1)}`,hlsInst.audioTrack==i?'✓':'')
      ));
    }else if(v.audioTracks?.length){
      const ts=[...v.audioTracks];
      openPop('Audio Tracks',ts.map((t,i)=>
        h('button',{class:'sm opt'+(t.enabled?' on':''),onclick:()=>{
          ts.forEach((x,j)=>x.enabled=j==i);audB.textContent='Audio: '+(t.language||t.label||i+1);pop.hidden=true;
        }},`${t.label||t.language||'Track '+(i+1)}`,t.enabled?'✓':'')
      ));
    }else{
      openPop('Audio Tracks',[
        msg('Chrome only allows audio track switching on multi-audio HLS (.m3u8) streams. For multi-audio MKV files, open this stream in VLC / MX Player:'),
        h('a',{href:intentUrl(url)},h('button',{class:'pri sm',style:'width:100%',type:'button'},'Open in VLC / MX Player'))
      ]);
    }
  };

  /* In-Player Stream Switcher */
  srcB.onclick=()=>{
    const list=ctx.allStreams||[];
    openPop(`Switch Source (${list.length})`,list.map(s=>{
      const cur=s.url==url;
      return h('button',{class:'sm opt'+(cur?' on':''),onclick:()=>{pop.hidden=true;if(!cur)play(s.url,title,{...ctx,s},true)}},
        `${s._addon}: ${[s.name,s.title].filter(Boolean).join(' · ').slice(0,70)}`,cur?'Playing':'');
    }));
  };

  /* In-Player Next & Episodes */
  nextB.onclick=async()=>{
    if(!ctx.next)return;
    nextB.disabled=true;nextB.textContent='Loading…';
    const r=await ctx.next();
    if(r)play(r[0],r[1],r[2],true);else{nextB.disabled=false;nextB.textContent='Next ⏭';toast('No stream for next episode')}
  };
  epB.onclick=()=>{
    const eps=ctx.episodes||[];
    openPop('Episodes',eps.map(ep=>{
      const lb=`S${ep.season??0}E${ep.episode??ep.number??0}`;
      const isCur=ep.id==ctx.vid;
      return h('button',{class:'sm opt'+(isCur?' on':''),onclick:async()=>{
        if(isCur)return pop.hidden=true;
        pop.hidden=true;toast('Loading '+lb+'…');
        const r=await ctx.playEp(ep);
        if(r)play(r[0],r[1],r[2],true);else toast('No stream found for '+lb);
      }},`${lb} · ${ep.title||ep.name||'Episode'}`,isCur?'▶':'');
    }));
  };

  /* Pro Subtitles (Online + Sync + Style + Local SRT/VTT File) */
  let subTracks=[],cues=[],subOffset=0,subPx=18,subStyle='box',subLabel='Off';
  const subSpan=h('span',{class:'box',style:`font-size:${subPx}px`,hidden:true});
  subBox.append(subSpan);
  const renderCue=()=>{
    if(!cues.length){subSpan.hidden=true;return}
    const t=v.currentTime-subOffset;
    const hit=cues.filter(c=>t>=c.s&&t<=c.e).map(c=>c.t).join('\n');
    if(hit){subSpan.textContent=hit;subSpan.hidden=false}else subSpan.hidden=true;
  };
  v.addEventListener('timeupdate',renderCue);
  v.addEventListener('seeked',renderCue);

  if(ctx.vid)(async()=>{
    const found=[];
    for(const a of addons.filter(a=>can(a,'subtitles',ctx.type,ctx.vid))){
      try{const r=await get(a.base,`/subtitles/${ctx.type}/${encodeURIComponent(ctx.vid)}.json`);for(const x of r.subtitles||[])if(x.url)found.push(x)}catch{}
    }
    found.sort((x,y)=>(y.lang=='eng'||y.lang=='en')-(x.lang=='eng'||x.lang=='en')||(x.lang||'').localeCompare(y.lang||''));
    subTracks=found.slice(0,25);
  })();

  ccB.onclick=()=>{
    const fileInp=h('input',{type:'file',accept:'.srt,.vtt,text/vtt',hidden:true,onchange:async()=>{
      const f=fileInp.files?.[0];if(!f)return;
      cues=parseSubs(await f.text());subLabel=f.name.slice(0,12);ccB.textContent='CC: Local';renderCue();pop.hidden=true;toast('Loaded '+f.name);
    }});
    const offLbl=h('span',{style:'font-size:12px;color:var(--mut)'},`Sync: ${subOffset.toFixed(1)}s`);
    const cnt={};
    openPop('Subtitles',[
      fileInp,
      h('div',{style:'display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px'},
        h('button',{class:'sm',onclick:()=>{subOffset-=.5;offLbl.textContent=`Sync: ${subOffset.toFixed(1)}s`;renderCue()}},'-0.5s'),
        h('button',{class:'sm',onclick:()=>{subOffset+=.5;offLbl.textContent=`Sync: ${subOffset.toFixed(1)}s`;renderCue()}},'+0.5s'),
        offLbl,
        h('button',{class:'sm',onclick:()=>{subPx=subPx==18?23:subPx==23?14:18;subSpan.style.fontSize=subPx+'px'}},'Size'),
        h('button',{class:'sm',onclick:()=>{subStyle=subStyle=='box'?'out':'box';subSpan.className=subStyle}},'Style')
      ),
      h('button',{class:'sm opt',onclick:()=>fileInp.click()},'📁 Load .srt / .vtt from phone','File'),
      h('button',{class:'sm opt'+(subLabel=='Off'?' on':''),onclick:()=>{cues=[];subLabel='Off';ccB.textContent='CC';renderCue();pop.hidden=true}},'Turn Subtitles Off',subLabel=='Off'?'✓':''),
      ...(subTracks.length?subTracks.map(tr=>{
        const l=tr.lang||'und';cnt[l]=(cnt[l]||0)+1;const nm=`${l.toUpperCase()} #${cnt[l]}`;
        return h('button',{class:'sm opt'+(subLabel==nm?' on':''),onclick:async()=>{
          ccB.textContent='CC…';pop.hidden=true;
          try{cues=parseSubs(await(await fetch(tr.url)).text());subLabel=nm;ccB.textContent='CC: '+l;renderCue()}
          catch{toast('Subtitle blocked by host (try local .srt)');ccB.textContent='CC'}
        }},`${nm} ${tr.id?'· '+String(tr.id).slice(0,22):''}`,subLabel==nm?'✓':'');
      }):[msg('No online subtitles found from addons.')])
    ]);
  };

  /* Persistence & Party Sync */
  const vid=ctx.vid;let lastSave=0;
  const saveP=()=>{
    if(!vid||!v.duration||isNaN(v.duration))return;
    pos[vid]=v.currentTime;sv('pos',pos);
    const rest=hist.filter(x=>x.id!=ctx.m.id);
    if(v.currentTime/v.duration>.92){
      done[vid]=1;sv('done',done);
      hist=ctx.nx?[{...ctx.m,vid:ctx.nx.id,lab:ctx.nx.lab,t:0,d:0},...rest]:rest;
    }else hist=[{...ctx.m,vid,lab:ctx.lab,t:v.currentTime,d:v.duration},...rest].slice(0,20);
    sv('hist',hist);
  };
  const clean=()=>{clearTimeout(hideTm);clearTimeout(hudTm);saveP();v._h?.destroy();if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})};
  me._clean=clean;

  v.onplay=()=>{playB.textContent='⏸';wake()};
  v.onpause=()=>{playB.textContent='▶';saveP();wake()};
  v.ontimeupdate=()=>{
    if(!dragging&&v.duration){rng.value=Math.round((v.currentTime/v.duration)*1000);curT.textContent=fmt(v.currentTime);durT.textContent=fmt(v.duration)}
    if(Date.now()-lastSave>5000){lastSave=Date.now();saveP()}
  };
  if(party){
    const ev=st=>()=>{if(Date.now()<ign)return;send({t:'sync',state:st||(v.paused?'pause':'play'),time:v.currentTime})};
    v.addEventListener('play',ev('play'));v.addEventListener('pause',ev('pause'));v.addEventListener('seeked',ev());
  }
  v.onloadedmetadata=()=>{
    durT.textContent=fmt(v.duration);
    const q=pos[vid];if(q>20&&q<v.duration*.92)v.currentTime=q;
    if(party&&ctx.rem&&!party.host)party.conns[0]?.send({t:'ask'});
  };
  v.onended=()=>{
    saveP();if(!ctx.next)return;
    let n=8;const b=h('button',{class:'pri nx'},'');
    const t=setInterval(()=>{if(!b.isConnected)return clearInterval(t);b.textContent=`Next episode in ${n}s (Tap now)`;if(!n--)b.click()},1000);
    b.onclick=async()=>{clearInterval(t);b.disabled=true;const r=await ctx.next();if(r)play(r[0],r[1],r[2],true);else{b.remove();toast('No stream for next episode.')}};
    me.append(b);b.focus();
  };
  const showErr=()=>{
    err.hidden=false;
    err.replaceChildren(
      h('b',{},'This stream couldn’t play in the browser'),
      msg('Chrome cannot play MKV/AC3 files or HTTP links on HTTPS. Try switching source or opening in VLC.'),
      h('div',{style:'display:flex;gap:10px;flex-wrap:wrap;justify-content:center'},
        h('a',{href:intentUrl(url)},h('button',{class:'pri',type:'button'},'Open in VLC / MX')),
        ctx.allStreams?.length>1&&h('button',{class:'sec',onclick:()=>{err.hidden=true;srcB.click()}},'Switch Source'),
        h('button',{class:'sec',onclick:()=>history.back()},'Go Back')
      )
    );
  };
  v.onerror=showErr;

  if(/\.m3u8(\?|$)/i.test(url)&&!v.canPlayType('application/vnd.apple.mpegurl')){
    const goHls=()=>{
      if(!window.Hls||!Hls.isSupported())return showErr();
      const H=hlsInst=new Hls();
      H.on(Hls.Events.MANIFEST_PARSED,(_,d)=>{
        if(d.levels?.length>1)qualB.hidden=false;
        if(H.audioTracks?.length>1)audB.textContent=`Audio (${H.audioTracks.length})`;
      });
      H.on(Hls.Events.AUDIO_TRACKS_UPDATED,(_,d)=>{if(d.audioTracks?.length>1)audB.textContent=`Audio (${d.audioTracks.length})`});
      H.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal)showErr()});
      H.loadSource(url);H.attachMedia(v);v._h=H;
    };
    window.Hls?goHls():document.head.append(h('script',{src:'https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js',onload:goHls,onerror:showErr}));
  }else v.src=url;

  wake();v.focus();
}

async function route(){
  rt++;
  const p=(location.hash.slice(1)||'/').split('/').map(decodeURIComponent);
  app.replaceChildren(msg('Loading…'));
  try{
    if(p[1]=='addons')await addonsView();
    else if(p[1]=='party')partyView();
    else if(p[1]=='s')await search(p[2]);
    else if(p[1]=='m')await detail(p[2],p[3]);
    else await home();
  }catch(e){app.replaceChildren(msg('Something went wrong: '+e.message))}
  scrollTo(0,0);
}

$('#sf').addEventListener('submit',e=>{e.preventDefault();const q=$('#q').value.trim();if(q)go('#/s/'+encodeURIComponent(q))});
addEventListener('hashchange',route);
addEventListener('popstate',()=>{if(pl){pl._clean?.();pl.remove();pl=null}});

addEventListener('keydown',e=>{
  if(pl){
    const v=pl.querySelector('video'),a=document.activeElement,onV=a==v||a==document.body;
    if(['Escape','Backspace','GoBack'].includes(e.key)){e.preventDefault();history.back()}
    else if(onV&&e.key=='ArrowLeft'){v.currentTime=Math.max(0,v.currentTime-10);e.preventDefault()}
    else if(onV&&e.key=='ArrowRight'){v.currentTime+=10;e.preventDefault()}
    else if((e.key=='Enter'||e.key==' ')&&a==v){v.paused?v.play():v.pause();e.preventDefault()}
    return;
  }
  const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
  if(!d||(['INPUT','TEXTAREA'].includes(e.target.tagName)&&d[0]))return;
  const els=[...document.querySelectorAll('button,[tabindex="0"],input,textarea,a[href]')].filter(x=>x.offsetParent);
  const cur=document.activeElement;
  if(!els.includes(cur)){els[0]?.focus();e.preventDefault();return}
  const r=cur.getBoundingClientRect(),cx=r.x+r.width/2,cy=r.y+r.height/2;
  let best=null,bs=1e9;
  for(const x of els){
    if(x==cur)continue;
    const q=x.getBoundingClientRect(),dx=q.x+q.width/2-cx,dy=q.y+q.height/2-cy,along=dx*d[0]+dy*d[1];
    if(along<=1)continue;
    const s=along+2*(Math.abs(dx*d[1])+Math.abs(dy*d[0]));
    if(s<bs){bs=s;best=x}
  }
  if(best){best.focus({preventScroll:true});best.scrollIntoView({block:'center',inline:'center'});e.preventDefault()}
});

(async()=>{
  const p=Promise.allSettled(addons.map(refresh));
  if(!addons.every(a=>a.m))await p;
  route();
})();
</script>
</body>
